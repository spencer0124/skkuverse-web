name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # node-version-file rather than a literal, so .nvmrc stays the one place
      # the version is decided.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

      # The webview routes by path, which only works while the bundle is
      # referenced from the root. A relative base emits ./assets/... , the
      # browser resolves that against the current path, and the request lands on
      # a path the build never wrote — which the SPA fallback answers with
      # index.html at 200. The page is then blank with no failing status code
      # anywhere, so nothing downstream of a deploy can catch it. This is the
      # only place it is cheap to catch.
      - name: Deep links survive the build
        run: |
          grep -q 'src="/assets/' apps/webview/dist/index.html
          test -f apps/webview/dist/_redirects
          test -f apps/webview/dist/_headers

      - run: pnpm lint:md

  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The umbrella's checks are stdlib-only Python and are cloned rather than
      # vendored, which is what lets this repo adopt them without touching its
      # dependency manifest. No setup-python: ubuntu-latest ships python3.
      - name: Fetch shared tooling
        run: git clone --depth 1 https://github.com/spencer0124/skkuverse "$RUNNER_TEMP/sv"

      - name: Conventions
        run: python3 "$RUNNER_TEMP/sv/exported/lint_conventions.py" --root .

      # packages/bridge/src/types.ts and packages/tokens/src/*.ts are byte
      # copies owned by skkuverse-app. This compares them against this repo's
      # own .contracts.lock.json, so it is offline and cannot go red because
      # someone edited the upstream — that drift arrives as the daily sync PR
      # instead. Editing a copy here is what this catches.
      - name: Contract integrity
        run: python3 "$RUNNER_TEMP/sv/exported/sync_contracts.py" check --repo web --root .
