<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/toss/tossface/dist/tossface.css" />

    <!--
      Identity and share cards, copied from skkuverse.com so a link to a web view
      page presents the same brand as the site it belongs to.

      Static on purpose. The values there are generated by Next from
      `src/lib/site.ts`, but nothing here varies per page, and a build step to
      produce four constants would cost more than it saves. If the marketing
      site's copy changes, these are the strings to change with it.

      The image and the icons are absolute URLs into skkuverse.com rather than
      copies. logo.png alone is 1.4 MB and the OG card is generated by a Next
      route, so vendoring either would mean carrying a binary and keeping it in
      step by hand. Both hosts are first-party and deploy together.

      og:image deliberately omits the `?<hash>` cache-buster the live site
      appends — that hash is its build id and would go stale here. The bare path
      is what skkuverse.com's own twitter:image uses.
    -->
    <title>스꾸버스 | 성균관 유니버스</title>
    <meta
      name="description"
      content="성균관대 학생을 위한 AI 공지 요약·셔틀버스·캠퍼스 정보 플랫폼. 오늘의 공지부터 혜화역 셔틀, 자과캠 셔틀까지 한 곳에서."
    />
    <meta name="theme-color" content="#1f3d2e" />

    <link rel="icon" href="https://skkuverse.com/favicon.ico" sizes="256x256" type="image/x-icon" />
    <link rel="icon" href="https://skkuverse.com/logo.png" />
    <link rel="apple-touch-icon" href="https://skkuverse.com/logo.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="스꾸버스" />
    <meta property="og:locale" content="ko_KR" />
    <!-- The canonical brand address, not this host: a shared link should land on
         the site, and these pages are opened by the app rather than browsed to. -->
    <meta property="og:url" content="https://skkuverse.com" />
    <meta property="og:title" content="스꾸버스 | 성균관 유니버스" />
    <meta
      property="og:description"
      content="성균관대 학생을 위한 AI 공지 요약·셔틀버스·캠퍼스 정보 플랫폼. 오늘의 공지부터 혜화역 셔틀, 자과캠 셔틀까지 한 곳에서."
    />
    <meta property="og:image" content="https://skkuverse.com/opengraph-image" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="스꾸버스 — 성균관 유니버스" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="스꾸버스 | 성균관 유니버스" />
    <meta name="twitter:description" content="오늘의 공지·셔틀·장소, 성대생이 함께" />
    <meta name="twitter:image" content="https://skkuverse.com/opengraph-image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
